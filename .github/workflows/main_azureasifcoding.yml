# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - azureasifcoding

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: asifmanagement39-lab/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_E16D4E23C5624FD88D4298575482932F }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_86E0338A5B3F4636BF1AF3406231B85C }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: asifmanagement39-lab/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_E16D4E23C5624FD88D4298575482932F }}/ghcr.io/asifmanagement39-lab/azure-asif-coding-:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_25BDDFF4C9844A88A65584D8CA7C8174 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_38132390350849989413DF002B724FB6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AD53279280AA4817A693CD5BFC9E0656 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'azureasifcoding'
          slot-name: 'Production'
          images: 'asifmanagement39-lab/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_E16D4E23C5624FD88D4298575482932F }}/ghcr.io/asifmanagement39-lab/azure-asif-coding-:${{ github.sha }}'
          